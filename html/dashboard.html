<!DOCTYPE html>
<html lang="en">
<head>
  <title>Smart Dustbin Dashboard</title>

  <!-- CSS -->
  <link rel="stylesheet" href="dashboard.css">

  <!-- Leaflet -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"/>
</head>

<body>

<header>Smart Dustbin Monitoring Dashboard</header>

<!-- CENTER BUTTONS -->
<div class="center-buttons">
  <button onclick="openAddBin()">➕ Add Bin</button>
  <button onclick="openDeleteBin()">❌ Delete Bin</button>
  <button onclick="showLevels()">📊 Levels</button>
  <button onclick="showAlerts()">🚨 Alerts</button>
  <button onclick="showHistory()">🕒 History</button>
</div>

<!-- LEVELS -->
<div id="levelsSection" class="section">
  <h2>All Bin Levels</h2>
  <div id="levelsList"></div>
</div>

<!-- ALERTS -->
<div id="alertsSection" class="section">
  <h2>Alert Bins (≥ 85%)</h2>
  <div id="alertsList"></div>
</div>

<!-- HISTORY -->
<div id="historySection" class="section">
  <h2>Alert History (Last 3 Days)</h2>
  <div id="historyList"></div>
</div>

<!-- MAP -->
<div id="mapContainer">
  <div id="map"></div>
</div>

<!-- ADD BIN -->
<div class="modal" id="addModal">
  <div class="modal-box">
    <h3>Add Bin</h3>
    <input id="binId" placeholder="Bin ID">
    <input id="lat" placeholder="Latitude">
    <input id="lon" placeholder="Longitude">
    <button onclick="addBin()">Add</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<!-- DELETE BIN -->
<div class="modal" id="deleteModal">
  <div class="modal-box">
    <h3>Delete Bin</h3>
    <input id="deleteId" placeholder="Bin ID">
    <button onclick="deleteBin()">Delete</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<!-- JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="dashboard.js"></script>

</body>
</html>
